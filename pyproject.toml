[project]
name = "airkeys"
version = "0.1.0"
description = "Use a MacBook keyboard to type on another computer over Wi-Fi."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "AirKeys contributors" }]
dependencies = []

[project.optional-dependencies]
linux = ["pynput>=1.7"]

[project.scripts]
airkeys = "airkeys.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
